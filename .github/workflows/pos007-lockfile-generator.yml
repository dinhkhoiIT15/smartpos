# POS-007 TEMPORARY workflow, removed after generating and committing pnpm-lock.yaml.
# Lockfile contents are public dependency metadata only. No secrets or environment access.
name: POS-007 Resolve Lockfile (temporary)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    name: Resolve pnpm lockfile for review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Resolve lockfile with pinned pnpm (no install scripts)
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Emit chunked base64 lockfile for committing through reviewed PR
        run: |
          node -e "const fs = require('node:fs'); const data = Buffer.from(fs.readFileSync('pnpm-lock.yaml')).toString('base64'); console.log('SMARTPOS_LOCK_BEGIN'); for (let i = 0; i < data.length; i += 100) console.log('LOCKCHUNK:' + data.slice(i, i + 100)); console.log('SMARTPOS_LOCK_END');"
