# TEMPORARY POS-010 lockfile resolver; delete after committing generated lockfile.
# Public npm dependency metadata only. CI receives no database credentials.
name: POS-010 Resolve Lockfile (temporary)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Resolve pinned pnpm lockfile without scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Emit chunked lockfile for PR review (base64, no secrets)
        run: |
          node -e "const fs = require('node:fs'); const data = Buffer.from(fs.readFileSync('pnpm-lock.yaml')).toString('base64'); console.log('SMARTPOS_LOCK_BEGIN'); for (let i = 0; i < data.length; i += 100) console.log('LOCKCHUNK:' + data.slice(i, i + 100)); console.log('SMARTPOS_LOCK_END');"
