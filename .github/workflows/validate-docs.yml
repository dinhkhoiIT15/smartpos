name: M0 Documentation Validation
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'project-management/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'scripts/**'
      - '.github/workflows/validate-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate M0 documentation
        run: node scripts/validate-context.mjs
# Not a required status check when path filters skip this workflow; use ci.yml for required checks.
