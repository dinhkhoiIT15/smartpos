name: M0 Repository Checks (not app CI)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m0-sanity:
    name: M0 file and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check scripts syntax and documentation
        run: |
          node --check scripts/validate-context.mjs
          node --check scripts/context-report.mjs
          node scripts/validate-context.mjs
      - name: Read-only context report
        run: node scripts/context-report.mjs
# POS-001 adds install, lockfile validation, typecheck, lint, tests, build.
