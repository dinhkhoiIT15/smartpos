name: M0 Foundation Checks (TypeScript workspace; no app runtime)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m0-sanity:
    name: M0 file and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Inspect workspace packages
        run: pnpm -r list --depth -1
      - name: Docs, workspace and strict TypeScript checks
        run: pnpm run check
      - name: Read-only context report
        run: node scripts/context-report.mjs
# Electron, Fastify and DB runtime tests are added in POS-007/008/009 and later.
