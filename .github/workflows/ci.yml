name: SmartPOS Foundation CI (Desktop + API)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m0-sanity:
    name: M0 file and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Inspect workspace packages
        run: pnpm -r list --depth -1
      - name: Docs, workspace and strict TypeScript checks
        run: pnpm run check
      - name: Desktop source security checks
        run: pnpm --filter @smartpos/desktop security:check
      - name: Build Electron main, preload and React renderer
        run: pnpm --filter @smartpos/desktop build
      - name: SQLite local migration, rollback, reopen and WAL backup tests
        run: pnpm --filter @smartpos/desktop test:local-db
      - name: Build and test Fastify API
        run: |
          pnpm --filter @smartpos/api build
          pnpm --filter @smartpos/api test
      - name: Verify shared DTOs and bigint VND domain rules
        run: |
          pnpm --filter @smartpos/contracts test
          pnpm --filter @smartpos/domain test
      - name: POS-011 offline authorization policy reference (design-only)
        run: node --test docs/security/offline-access-reference.test.mjs
      - name: Read-only context report
        run: node scripts/context-report.mjs

  postgres-migrations:
    name: PostgreSQL v1 migration and constraints (ephemeral)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartpos_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: smartpos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartpos_test -d smartpos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POS_DB_TEST_URL: postgresql://smartpos_test:local_ci_only@127.0.0.1:5432/smartpos_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Validate committed Drizzle migration history
        run: pnpm --filter @smartpos/db schema:check
      - name: Apply migration only to disposable CI database and test constraints
        run: pnpm --filter @smartpos/db test:migrations
      - name: POS-014 catalog CRUD, SKU, store scope and transaction integration
        run: pnpm --filter @smartpos/api test:catalog:pg
      - name: POS-015 inventory balances, idempotency, concurrency and rollback integration
        run: pnpm --filter @smartpos/api test:inventory:pg

# Database tests run ONLY against disposable CI PostgreSQL; Neon is never contacted.

  sqlite-windows:
    name: Windows Node 24 SQLite migration and cleanup tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Frozen install without Electron postinstall (built-in SQLite tests only)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise WAL, transactions, reopen and temp teardown on Windows
        run: pnpm --filter @smartpos/desktop test:local-db
