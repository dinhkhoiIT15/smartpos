# Temporary read-only job to generate exact migration/lockfile on the pinned toolchain.
# Delete this workflow after committing reviewed generated files.
name: POS-012 Generate Drizzle Migration (temporary)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    name: Generate Drizzle v1 SQL + lockfile (no database access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Resolve dependencies without executing install scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate migration from reviewed TypeScript schema (offline)
        run: pnpm --filter @smartpos/db schema:generate
      - name: Encode public migration artifacts for reviewed commit (no secrets)
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const root = 'packages/db/drizzle';
          const files = ['pnpm-lock.yaml'];
          function visit(dir) {
            for (const name of fs.readdirSync(dir)) {
              const p = path.posix.join(dir, name);
              if (fs.statSync(p).isDirectory()) visit(p);
              else files.push(p);
            }
          }
          visit(root);
          if (!files.some(p => /drizzle\/[^/]+\.sql$/.test(p)) || !files.some(p => p.endsWith('_snapshot.json'))) {
            throw new Error('Drizzle migration SQL/snapshot missing: generation did not complete successfully');
          }
          const output = Object.fromEntries(files.sort().map(p => [p, fs.readFileSync(p, 'utf8')]));
          const encoded = Buffer.from(JSON.stringify(output), 'utf8').toString('base64');
          console.log('SMARTPOS_ARTIFACTS_BEGIN');
          for (let i = 0; i < encoded.length; i += 100) console.log('ARTIFACT_CHUNK:' + encoded.slice(i, i + 100));
          console.log('SMARTPOS_ARTIFACTS_END');
          NODE
