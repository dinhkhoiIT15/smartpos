name: Bug report
description: Report a reproducible defect without exposing private data
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / device
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and test evidence
      description: Do not post credentials or personal data.
