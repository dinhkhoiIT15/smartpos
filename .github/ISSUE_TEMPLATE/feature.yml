name: Feature or task
description: Track a scoped SmartPOS task
labels: [enhancement]
body:
  - type: input
    id: logical_id
    attributes:
      label: Logical ID
      placeholder: POS-001
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and user value
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected modules
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / ADR
  - type: textarea
    id: tests
    attributes:
      label: Required tests / evidence
